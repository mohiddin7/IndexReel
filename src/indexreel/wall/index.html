<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IndexReel clip wall</title>
<style>
:root {
  --bg: #f6f6f3; --card: #ffffff; --ink: #1d1f23; --muted: #5a606b; --line: #d6d8dd;
  --merged: #1f6f43; --unresolved: #9a5b00; --apart: #5a606b; --single: #3b4a6b; --hand: #5b3fa0;
  --accent: #1b4fb8; --warn-bg: #fff3d6; --lost: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --card: #1e2125; --ink: #e8e9ec; --muted: #a2a8b3; --line: #343941;
    --merged: #5fcf94; --unresolved: #f0b04a; --apart: #a2a8b3; --single: #8fa6d8; --hand: #b9a4f2;
    --accent: #7fa6ff; --warn-bg: #3a3020; --lost: #ff8a80;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; padding-bottom: 64px; }
header, main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
header { padding-top: 16px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 17px; margin: 28px 0 8px; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0 0 12px; }
.badge { display: inline-block; border: 1px solid currentColor; border-radius: 4px; padding: 0 6px; font-size: 12px; font-weight: 600; }
.merged { color: var(--merged); } .unresolved { color: var(--unresolved); } .apart { color: var(--apart); }
.single { color: var(--single); } .hand { color: var(--hand); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip { border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font-size: 13px; }
.pair { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; }
@media (max-width: 700px) { .pair { grid-template-columns: 1fr; } }
.pair img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; display: block; }
.noimg { border: 1px dashed var(--line); border-radius: 4px; padding: 24px 8px; text-align: center; }
.meter { position: relative; height: 10px; background: var(--line); border-radius: 5px; margin: 14px 0 4px; }
.meter i { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--ink); }
.meter b { position: absolute; top: -3px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--accent); }
.times { border-collapse: collapse; font-size: 13px; margin: 6px 0; }
.times td, .times th { padding: 1px 10px 1px 0; text-align: left; font-weight: normal; }
.times th { color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: wait; }
button.yes { border-color: var(--merged); } button.no { border-color: var(--apart); }
input[type=text] { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); flex: 1 1 160px; min-width: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.warn { background: var(--warn-bg); border-radius: 6px; padding: 6px 10px; margin: 8px 0; font-size: 13px; }
.err { color: var(--lost); font-size: 13px; }
select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); max-width: 100%; }
.claims { margin: 4px 0 12px; padding-left: 20px; }
.claims li { margin: 2px 0; }
.lost-h { color: var(--lost); }
#disclaimer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; text-align: center; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>IndexReel clip wall</h1>
  <div id="runinfo" class="muted small"></div>
</header>
<main>
  <section aria-labelledby="h-todo"><h2 id="h-todo">Needs a decision</h2><div id="todo"></div></section>
  <section aria-labelledby="h-recs"><h2 id="h-recs">Recordings</h2><div id="recs"></div></section>
  <section aria-labelledby="h-with"><h2 id="h-with">Withdraw a recording</h2><div id="withdraw"></div></section>
  <section aria-labelledby="h-hand"><h2 id="h-hand">Decided by hand</h2><div id="hand"></div></section>
</main>
<div id="disclaimer" role="note">This shows which clips come from the same recording. It does not say whether anything is true or false.</div>
<script>
let S = null, wClip = "";
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = (x, d = 2) => Number(x).toFixed(d);
const pairById = () => Object.fromEntries(S.pairs.map((p) => [p.id, p]));

function meter(p) {
  const th = S.thresholds, at = (v) => Math.min(100, Math.max(0, v * 100));
  return `<div class="meter" role="img" aria-label="aligned score ${num(p.aligned)}, merge at ${num(th.merge_at)}, floor ${num(th.floor)}">
    <i style="left:${at(th.floor)}%" title="floor"></i><i style="left:${at(th.merge_at)}%" title="merge at"></i><b style="left:${at(p.aligned)}%"></b></div>
    <div class="small muted">aligned <strong>${num(p.aligned)}</strong> · merge at ${num(th.merge_at)} · floor ${num(th.floor)} · best-match ${num(p.score)}</div>`;
}

function evidence(p) {
  if (!p.evidence) return `<div class="noimg muted small">no evidence image for this pair</div>`;
  const src = p.evidence.split("/").map(encodeURIComponent).join("/");
  const rows = p.evidence_times.map(([ta, tb]) => `<tr><td>${esc(ta)} s</td><td>${esc(tb)} s</td></tr>`).join("");
  return `<img src="/${src}" alt="aligned frames of ${esc(p.a)} and ${esc(p.b)}">
    <table class="times"><tr><th>${esc(p.a)}</th><th>${esc(p.b)}</th></tr>${rows}</table>`;
}

function verify(p) {
  const v = p.verify;
  if (!v.verdict) return "";
  const conf = v.confidence ? ` (confidence ${esc(v.confidence)})` : "";
  return `<div class="small"><strong>Verifier:</strong> ${esc(v.verdict)}${conf}. ${esc(v.reason || "")}</div>`;
}

function pairCard(p) {
  const d = p.decision;
  const hand = d ? `<span class="badge hand">${esc(d.action === "approve_merge" ? "approved by hand" : "split by hand")}</span>` : "";
  const note = d && d.note ? `<div class="small muted">Your note: ${esc(d.note)}</div>` : "";
  const mirrored = p.mirrored ? " · one clip mirrored" : "";
  const off = (p.offset_s >= 0 ? "+" : "") + num(p.offset_s, 1);
  return `<article class="card" id="pair-${esc(p.id)}" data-pair="${esc(p.id)}">
    <div><strong>${esc(p.a)}</strong> ↔ <strong>${esc(p.b)}</strong> <span class="badge ${esc(p.band)}">${esc(p.band)}</span> ${hand}</div>
    <div class="pair">
      <div>${evidence(p)}</div>
      <div>${meter(p)}
        <div class="small muted">${esc(p.a)} ${num(p.a_span[0], 1)}–${num(p.a_span[1], 1)} s · ${esc(p.b)} ${num(p.b_span[0], 1)}–${num(p.b_span[1], 1)} s · offset ${off} s${mirrored}</div>
        ${verify(p)}${note}
        <div class="actions">
          <input type="text" aria-label="Note for ${esc(p.a)} and ${esc(p.b)}" placeholder="Note (optional)" maxlength="500">
          <button class="yes" data-action="approve_merge" ${p.band === "merged" ? "disabled" : ""}>Approve merge</button>
          <button class="no" data-action="split" ${p.band === "apart" ? "disabled" : ""}>Split</button>
          ${d ? `<button data-action="reset">Reset to matcher</button>` : ""}
        </div>
        <div class="err" role="alert"></div>
      </div>
    </div></article>`;
}

function recCard(r) {
  const byId = Object.fromEntries(S.clips.map((c) => [c.id, c]));
  const chips = r.members.map((m) => {
    const c = byId[m], crop = c.crop && c.crop.method !== "none" ? ` · cropped (${esc(c.crop.method)})` : "";
    return `<span class="chip">${esc(m)} · ${num(c.duration_s, 1)} s${crop}</span>`;
  }).join("");
  const P = pairById();
  const open = r.unresolved_pairs.map((id) => `<a href="#pair-${esc(id)}">${esc(id)}</a>`).join(", ");
  const conflicts = r.conflicts.length
    ? `<div class="warn">Contradiction: ${r.conflicts.map(esc).join(", ")} ${r.conflicts.length > 1 ? "are" : "is"} apart although both clips are in this recording. Merging is not transitive; decide which pair is wrong.</div>` : "";
  const waiting = open ? `<div class="small muted">Waiting on: ${open}</div>` : "";
  return `<article class="card"><div><strong>${esc(r.id)}</strong> <span class="badge ${esc(r.status)}">${esc(r.status)}</span>
    <span class="muted small">${r.members.length} clip${r.members.length === 1 ? "" : "s"}</span></div>
    <div class="chips">${chips}</div>${conflicts}${waiting}
    ${r.evidence_pairs.map((id) => pairCard(P[id])).join("")}</article>`;
}

function withdrawBox() {
  const box = document.getElementById("withdraw");
  if (!S.claims) {
    box.innerHTML = `<p class="muted">No claims sheet. Start the wall with <code>--claims claims.csv</code> to see which claims lose their video support.</p>`;
    return;
  }
  const keep = S.recordings.find((r) => r.members.includes(wClip)) || S.recordings[0];
  wClip = keep.members[0];
  const opts = S.recordings.map((r) => `<option value="${esc(r.members[0])}" ${r === keep ? "selected" : ""}>${esc(r.id)} (${esc(r.status)}): ${r.members.map(esc).join(", ")}</option>`).join("");
  box.innerHTML = `<div class="card"><label>Withdraw recording <select id="wsel">${opts}</select></label><div id="wbody" aria-live="polite"></div></div>`;
  document.getElementById("wsel").addEventListener("change", (e) => { wClip = e.target.value; loadWithdraw(keepId(e.target.value)); });
  loadWithdraw(keep.id);
}

const keepId = (clip) => S.recordings.find((r) => r.members.includes(clip)).id;

async function loadWithdraw(id) {
  const body = document.getElementById("wbody");
  try {
    const res = await fetch("/api/withdraw?recording=" + encodeURIComponent(id));
    const out = await res.json();
    if (!res.ok) throw new Error(out.error || res.statusText);
    if (document.getElementById("wbody") !== body) return;
    body.innerHTML = withdrawLists(out);
  } catch (e) {
    body.innerHTML = `<p class="err" role="alert">${esc(e.message)}</p>`;
  }
}

function withdrawLists(out) {
  const w = out.withdrawn, text = (id) => (out.text[id] ? ` ${esc(out.text[id])}` : "");
  const item = (e) => {
    const left = e.remaining.length ? ` → still cited in ${e.remaining.map(esc).join(", ")}` : "";
    const tied = e.tied_by.length ? `; open pairs ${e.tied_by.map((id) => `<a href="#pair-${esc(id)}">${esc(id)}</a>`).join(", ")}` : "";
    return `<li><strong>${esc(e.claim_id)}</strong>${text(e.claim_id)}${left}${tied}</li>`;
  };
  const list = (title, rows, cls = "") => `<h3 class="${cls}">${title} (${rows.length})</h3>${rows.length ? `<ul class="claims">${rows.join("")}</ul>` : `<p class="muted small">none</p>`}`;
  const open = w.unresolved_pairs.length ? `<div class="warn">Pairs still undecided against this recording: ${w.unresolved_pairs.map((id) => `<a href="#pair-${esc(id)}">${esc(id)}</a>`).join(", ")}.</div>` : "";
  return `<p>Withdrawn: <strong>${esc(w.id)}</strong> (${esc(w.status)}), clips ${w.members.map(esc).join(", ")}</p>${open}
    ${list("Lose all video support", out.lost.map(item), "lost-h")}
    ${list("Keep some video support", out.kept.map(item))}
    ${list("Undecided: the rest may be the same recording", out.undecided.map(item))}
    ${list("Unaffected", out.unaffected.map((id) => `<li><strong>${esc(id)}</strong>${text(id)}</li>`))}`;
}

function render() {
  const run = S.run;
  document.getElementById("runinfo").textContent = `${run.n_clips} clips · ${run.sample} · made ${run.created_utc} · ${S.audit.length} human decision${S.audit.length === 1 ? "" : "s"} logged`;
  const todo = S.pairs.filter((p) => p.band === "unresolved");
  document.getElementById("todo").innerHTML = todo.length ? todo.map(pairCard).join("") : `<p class="muted">Nothing is waiting for a decision.</p>`;
  document.getElementById("recs").innerHTML = S.recordings.map(recCard).join("");
  const hand = S.pairs.filter((p) => p.decision && p.band !== "unresolved");
  withdrawBox();
  document.getElementById("hand").innerHTML = hand.length ? hand.map(pairCard).join("") : `<p class="muted">No pair has been decided by hand yet.</p>`;
}

async function decide(button) {
  const card = button.closest("[data-pair]");
  const body = {pair: card.dataset.pair, action: button.dataset.action, note: card.querySelector("input").value};
  const buttons = card.querySelectorAll("button");
  buttons.forEach((b) => (b.disabled = true));
  try {
    const res = await fetch("/api/decide", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const out = await res.json();
    if (!res.ok) throw new Error(out.error || res.statusText);
    S = out;
    render();
  } catch (e) {
    card.querySelector(".err").textContent = `Not saved: ${e.message}`;
    buttons.forEach((b) => (b.disabled = false));
  }
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-action]");
  if (b) decide(b);
});

fetch("/api/state").then((r) => r.json()).then((s) => { S = s; render(); })
  .catch((e) => { document.getElementById("runinfo").textContent = `Could not load the run: ${e.message}`; });
</script>
</body>
</html>
